<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #1f2937;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: #374151;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      background: #f59e0b;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #d97706;
    }
    .result {
      margin-top: 20px;
      padding: 14px;
      background: #fef3c7;
      border-radius: 8px;
      color: #92400e;
      display: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Solar Calculator</h1>

    <label for="panelWatts">Panel Watts (W)</label>
    <input type="number" id="panelWatts" placeholder="e.g. 400" min="1" />

    <label for="batteryWh">Battery Capacity (Wh)</label>
    <input type="number" id="batteryWh" placeholder="e.g. 1200" min="1" />

    <button onclick="calculateSolar()">Calculate</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    function calculateSolar() {
      const watts = parseFloat(document.getElementById("panelWatts").value);
      const battery = parseFloat(document.getElementById("batteryWh").value);
      const resultBox = document.getElementById("result");

      if (!watts || !battery || watts <= 0 || battery <= 0) {
        resultBox.style.display = "block";
        resultBox.textContent = "Please enter valid positive numbers for both fields.";
        return;
      }

      // Assumes ~80% real-world charging efficiency and 5 peak sun hours/day
      const effectiveWatts = watts * 0.8;
      const chargeHours = (battery / effectiveWatts).toFixed(1);
      const dailyOutput = Math.round(effectiveWatts * 5);

      resultBox.style.display = "block";
      resultBox.innerHTML =
        `<strong>Estimated Charge Time:</strong> ${chargeHours} hours of good sun<br>` +
        `<strong>Estimated Daily Output:</strong> ~${dailyOutput} Wh/day`;
    }
  </script>
</body>
</html>
